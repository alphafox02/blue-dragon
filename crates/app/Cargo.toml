[package]
name = "blue-dragon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BLE 5 sniffer with wideband SDR capture"
authors = ["CEMAXECUTER LLC"]
homepage = "https://github.com/alphafox02/blue-dragon"
repository = "https://github.com/alphafox02/blue-dragon"

[package.metadata.deb]
maintainer = "alphafox02 <awdmesh@gmail.com>"
section = "comm"
priority = "optional"
assets = [
    ["target/release/blue-dragon", "usr/bin/", "755"],
]
depends = "$auto"

[[bin]]
name = "blue-dragon"
path = "src/main.rs"

[dependencies]
bd-protocol = { path = "../protocol" }
bd-dsp = { path = "../dsp" }
bd-output = { path = "../output" }
bd-sdr = { path = "../sdr", default-features = false }
bd-gpu = { path = "../gpu", optional = true }
bd-hci = { path = "../hci", optional = true }
crossbeam.workspace = true
num-complex.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
ctrlc = "3"
serde_json = { workspace = true, optional = true }

[features]
default = ["usrp"]
usrp = ["bd-sdr/usrp"]
hackrf = ["bd-sdr/hackrf"]
bladerf = ["bd-sdr/bladerf"]
soapysdr = ["bd-sdr/soapysdr"]
zmq = ["bd-output/zmq"]
gps = ["bd-output/gps"]
gpu = ["dep:bd-gpu"]
hci = ["dep:bd-hci", "dep:serde_json"]
aaronia = ["bd-sdr/aaronia"]
rfnm = ["bd-sdr/rfnm"]
sidekiq = ["bd-sdr/sidekiq"]
